<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nepal Palika Map — Contributors Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <div class="seal"><img src="logo.png" alt="Dhulikhel Municipality emblem" /></div>
        <div class="brand-text">
          <p class="brand-eyebrow">पालिका म्याप </p>
          <h1>PALIKA MAP</h1>
          <p class="brand-sub">Contributors Dashboard</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="leaderboard-wrap">
          <button id="leaderboardBtn" class="leaderboard-btn" type="button" aria-expanded="false">
            <svg class="lb-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 5M7 5H4a3 3 0 0 0 3 5"/></svg>
            <span>Top 10</span>
            <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="leaderboardPanel" class="leaderboard-panel hidden" role="menu">
            <div class="leaderboard-head">
              <span>Top 10 Contributors</span>
              <span class="lb-sub">Combined across all categories</span>
            </div>
            <div id="leaderboardList" class="leaderboard-list"></div>
          </div>
        </div>
        <button id="refreshBtn" class="refresh-btn" type="button" title="Reset all filters and selections">
          <svg class="refresh-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <div class="stage">
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="category-wrap">
          <button id="categoryBtn" class="category-btn" type="button" aria-expanded="false">
            <svg class="cat-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>Category</span>
            <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="categoryPanel" class="category-panel hidden" role="menu">
            <div class="category-panel-head">
              <span>Filter by category</span>
              <div>
                <button id="selectAllBtn" class="text-btn" type="button">Select all</button>
                <button id="clearBtn" class="text-btn" type="button">Clear</button>
              </div>
            </div>
            <div id="categoryList" class="category-list"></div>
          </div>
        </div>
        <div class="admin-controls">
          <div class="dd-wrap province-wrap">
            <button id="provinceBtn" class="dd-btn province-btn" type="button" aria-expanded="false" title="Filter by province">
              <svg class="dd-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 4 4-8"/></svg>
              <span>Province</span>
              <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="provincePanel" class="dd-panel hidden" role="menu">
              <div class="dd-panel-head">
                <span>Province</span>
                <button id="provinceClearBtn" class="text-btn" type="button">Clear</button>
              </div>
              <div id="provinceList" class="dd-list"></div>
            </div>
          </div>
          <div class="dd-wrap district-wrap">
            <button id="districtBtn" class="dd-btn district-btn" type="button" aria-expanded="false" disabled title="Select a province first">
              <svg class="dd-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span>District</span>
              <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="districtPanel" class="dd-panel hidden" role="menu">
              <div class="dd-panel-head">
                <span>District</span>
                <button id="districtClearBtn" class="text-btn" type="button">Clear</button>
              </div>
              <div id="districtList" class="dd-list"></div>
            </div>
          </div>
          <div class="dd-wrap municipality-wrap">
            <button id="municipalityBtn" class="dd-btn municipality-btn" type="button" aria-expanded="false" disabled title="Select a district first">
              <svg class="dd-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>
              <span>Municipality</span>
              <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="municipalityPanel" class="dd-panel hidden" role="menu">
              <div class="dd-panel-head">
                <span>Municipality</span>
                <button id="municipalityClearBtn" class="text-btn" type="button">Clear</button>
              </div>
              <div id="municipalityList" class="dd-list"></div>
            </div>
          </div>
          <div class="dd-wrap ward-wrap">
            <button id="wardBtn" class="dd-btn ward-btn" type="button" aria-expanded="false" disabled title="Select a municipality first">
              <svg class="dd-icon ward-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
              <span>Ward</span>
              <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="wardPanel" class="dd-panel ward-panel hidden" role="menu">
              <div class="dd-panel-head">
                <span>Wards</span>
                <button id="wardClearBtn" class="text-btn" type="button">Clear</button>
              </div>
              <div id="wardList" class="dd-list ward-list"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="toolbar-row-2">
        <div class="active-chips" id="activeChips"></div>
      </div>
    </div>

    <main class="grid">
      <section class="panel map-panel">
        <div id="map"></div>
      </section>

      <div class="mini-stats" id="miniStats"></div>

      <div class="legend hidden" id="legend">
        <div class="legend-title">Legend</div>
        <div id="legendList"></div>
      </div>

      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize map and table panels" tabindex="0"></div>

      <section class="panel table-panel">
        <div class="table-panel-head">
          <button id="tableCollapseBtn" class="panel-collapse-btn" type="button" title="Collapse panel" aria-expanded="true">
            <svg class="collapse-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h2>Contributor Records</h2>
          <input id="tableSearch" type="text" placeholder="Search contributor…" autocomplete="off" />
          <button id="tableCloseBtn" class="panel-close-btn" type="button" title="Close panel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="table-scroll" id="tableScroll">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Contributor</th>
                <th>Category</th>
                <th>Address</th>
                <th style="text-align:right;">Points</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="scroll-hint" id="scrollHint">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><path d="M9 9V4.5a2.5 2.5 0 0 1 5 0V9"/><path d="M14 9V7a2 2 0 0 1 4 0v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-5.583-3.796L4 12"/></svg>
          Click the table to scroll through the full list
        </div>
        <div class="table-footer" id="tableFooter"></div>
      </section>
    </main>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="admin-data.js"></script>
  <script src="stats-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
